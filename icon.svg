<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#6366f1"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1"    stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="100" height="100" rx="24" fill="url(#glow)"/>

  <!-- calculator body -->
  <rect x="27" y="15" width="46" height="70" rx="11" fill="#ffffff"/>

  <!-- display -->
  <rect x="34" y="23" width="32" height="13" rx="4" fill="#ede9fe"/>
  <rect x="52" y="27.5" width="10" height="4" rx="2" fill="#8b5cf6"/>

  <!-- keypad -->
  <g fill="#c4b5fd">
    <rect x="34" y="44" width="8" height="8" rx="2.5"/>
    <rect x="46" y="44" width="8" height="8" rx="2.5"/>
    <rect x="58" y="44" width="8" height="8" rx="2.5"/>
    <rect x="34" y="56" width="8" height="8" rx="2.5"/>
    <rect x="46" y="56" width="8" height="8" rx="2.5"/>
    <rect x="58" y="56" width="8" height="8" rx="2.5"/>
    <rect x="34" y="68" width="8" height="8" rx="2.5"/>
    <rect x="46" y="68" width="8" height="8" rx="2.5"/>
  </g>
  <!-- accent operator button -->
  <rect x="58" y="68" width="8" height="8" rx="2.5" fill="#fb923c"/>
</svg>
